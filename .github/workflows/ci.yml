name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Production build
        run: npm run build

      # The research hub is a SEPARATE Vite build (vite.config.research.mjs, base /research/,
      # outDir ../dist/research). Without this step a broken hub ships while CI stays green,
      # because `npm run build` alone does not touch it.
      - name: Research hub build
        run: npm run build:research
