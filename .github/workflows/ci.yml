name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # vitest.config.js includes backend/**/*.test.js, but backend deps live in
      # backend/package.json (better-sqlite3, fastify). Without this the backend
      # suites fail to import rather than fail on their assertions, so root
      # `npm test` was green only for tests that never touched a backend dep.
      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Run unit tests
        run: npm test

      # Guards the hub's data model: every new depth-pass row must be complete,
      # Tether's negative figure must stay negative, ERC-8004 must not read as a
      # payment layer, and no em/en dash may enter the content.
      - name: Verify research hub data
        run: node scripts/verify-hub-depth.mjs

      - name: Production build
        run: npm run build

      # The research hub is a SEPARATE Vite build (vite.config.research.mjs, base /research/,
      # outDir ../dist/research). Without this step a broken hub ships while CI stays green,
      # because `npm run build` alone does not touch it.
      - name: Research hub build
        run: npm run build:research
