# StableSense nginx site. One origin: serves the built frontend from dist/ and
# reverse-proxies /api to the Fastify backend. No CORS needed.
#
# Live domain: stablesense.withkeshav.com. Enable TLS with:
#   sudo certbot --nginx -d stablesense.withkeshav.com

server {
    listen 80;
    server_name stablesense.withkeshav.com;

    root /opt/stablesense/dist;
    index index.html;

    # --- Security headers (declared once, at server level) -------------------
    # nginx does NOT merge add_header across levels: a location that declares its
    # own add_header discards EVERY header inherited from the server block. So the
    # four headers below are repeated verbatim in each location that sets its own
    # Cache-Control (^~ /assets/ and /api/). Locations that set no add_header of
    # their own (/ , /research/ , /research/changelog/ , = /research) inherit this
    # set unchanged.
    # The 'always' flag keeps the headers on error responses (4xx/5xx) as well.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Report-Only on purpose, NOT enforced: the app ships an inline pre-paint
    # theme bootstrap script, and an enforced policy would break it. This reports
    # violations without blocking anything.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Every file that is not content-hashed (index.html, /research/ pages, ...)
    # must revalidate, so a deploy is visible on the next page load. The
    # ^~ /assets/ location below overrides this with a long immutable TTL.
    add_header Cache-Control "no-cache" always;

    # Content-hashed vite output: the filename changes on every build, so a long
    # immutable TTL is safe. No 'always' here on purpose: a 404 for a missing
    # asset must not be cached for a year. try_files makes a miss an explicit
    # 404 instead of the old SPA fallback (which served HTML for a missing asset).
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    }

    # All API responses must not be cached in the browser. This covers /api/ai
    # too: the former exact-match = /api/ai block had identical proxy settings,
    # so it is folded into this shared location.
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    }

    location = /research {
        return 301 /research/$is_args$args;
    }

    location /research/ {
        root /opt/stablesense/dist;
        try_files $uri /research/index.html =404;
    }

    # The changelog is a directory page. Directory-index semantics did NOT serve
    # it: measured 2026-10-03, `try_files $uri $uri/ /research/index.html =404`
    # still returned the 77913-byte hub for /research/changelog/ while the
    # 11139-byte page sat unserved, and a 200 hid the fact. So the subpage is
    # resolved by an explicit FILE fallback here instead of by index resolution.
    # A missing file 404s rather than quietly serving the hub.
    location = /research/changelog {
        return 301 /research/changelog/;
    }

    location /research/changelog/ {
        root /opt/stablesense/dist;
        try_files /research/changelog/index.html =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
