# StableSense nginx site. One origin: serves the built frontend from dist/ and
# reverse-proxies /api to the Fastify backend. No CORS needed.
#
# Live domain: stablesense.withkeshav.com. Enable TLS with:
#   sudo certbot --nginx -d stablesense.withkeshav.com

server {
    listen 80;
    server_name stablesense.withkeshav.com;

    root /opt/stablesense/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /research {
        return 301 /research/$is_args$args;
    }

    location /research/ {
        root /opt/stablesense/dist;
        index index.html;
        # $uri/ is required, not decoration. Without it a directory URI such as
        # /research/changelog/ matches no file, falls through to the fallback
        # below, and quietly serves the hub page instead of the subpage (measured
        # 2026-10-03: /research/changelog/ returned the 77913-byte hub while the
        # 11139-byte changelog sat unserved). $uri/ also makes nginx answer
        # /research/changelog with a 301 to the slashed form, so both spellings
        # resolve to the page rather than one of them to the hub.
        try_files $uri $uri/ /research/index.html =404;
    }

    location / {
        try_files $uri /index.html;
    }

    # Never cache the API responses in the browser.
    location = /api/ai {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store";
    }
}
