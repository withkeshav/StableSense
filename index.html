<!DOCTYPE html>

  <script>
    (function () {
      if (location.pathname === '/research') {
        location.replace('/research/' + location.search + location.hash);
        return;
      }
      var key = 'stablesense:theme';
      var legacy = 'stablepulse:theme';
      var mode = 'light';
      try { mode = localStorage.getItem(key) || localStorage.getItem(legacy) || 'light'; } catch (e) {}
      var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var effective = mode === 'system' ? (dark ? 'dark' : 'light') : mode;
      document.documentElement.setAttribute('data-theme', effective);
    })();
  </script>
